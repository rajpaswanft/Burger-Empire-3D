#bar{height:12px;background:#fff8e7;border:3px solid #3b2200;border-radius:10px;overflow:hidden}
#fill{height:100%;width:0;background:repeating-linear-gradient(45deg,#ef476f 0 10px,#ff7a96 10px 20px);transition:width .25s}
#carry{position:fixed;left:10px;bottom:calc(12px + env(safe-area-inset-bottom));padding:1px 12px;font-size:16px;pointer-events:none}
#hint{position:fixed;left:12px;bottom:calc(52px + env(safe-area-inset-bottom));width:min(58vw,250px);color:#fff8e7;font-weight:800;font-size:13px;line-height:1.15;text-shadow:0 2px 0 #3b2200,0 0 6px #3b2200;pointer-events:none;transition:opacity .6s}

#lvup small{display:block;font-size:13px}
#lvup.show{animation:lvp 3s ease forwards}
@keyframes lvp{0%{transform:translateX(130%)}10%,85%{transform:translateX(0)}100%{transform:translateX(130%)}}
#fade{position:fixed;inset:0;background:#2b1d2e;opacity:1;pointer-events:none;transition:opacity .5s;z-index:9}
.pop{position:fixed;transform:translate(-50%,-50%);font-weight:800;font-size:24px;white-space:nowrap;pointer-events:none;text-shadow:-2px 0 #3b2200,2px 0 #3b2200,0 -2px #3b2200,0 3px #3b2200;animation:up .95s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-170%);opacity:0}}
</style>
</head>

const carryG=new THREE.Group();carryG.position.y=2.55;player.add(carryG);const vel=new THREE.Vector3();let walkP=0;

function take(arr,type){const i=arr.lastIndexOf(type);if(i<0)return false;arr.splice(i,1);return true;}

/* ================= customers ================= */
const custs=[];
function spawnCust(){if(CT.q.length>=5||custs.length>=12)return;
 const g=new THREE.Group();g.position.set(CT.x,0,L.ent.z+3.2);scene.add(g);const bd=new THREE.Group();g.add(bd);
 box(bd,.6,.75,.4,pick([0x4cc9f0,0xf72585,0x7209b7,0x90be6b,0xf9c74f]),0,.95,0);sph(bd,.3,pick([0xffd9b3,0xe0ac69,0x8d5524,0xf1c27d]),0,1.58,0);box(bd,.5,.14,.5,pick([0x222222,0x6f4e37,0xd4a017]),0,1.84,0);
 const lA=limb(bd,.24,.55,.24,0x3a3a5a,-.16,.55,0),lB=limb(bd,.24,.55,.24,0x3a3a5a,.16,.55,0);
 const bub=new THREE.Group();bub.position.y=2.3;g.add(bub);cyl(bub,.55,.55,.1,0xffffff,0,0,0,16);const it=makeItem('b');it.scale.setScalar(.9);it.position.y=.08;bub.add(it);
 const c={g,bd,lA,lB,bub,state:'queue',path:[],t:0,ph:Math.random()*6,arr:false};CT.q.push(c);custs.push(c);}
function updCust(c,dt){
 if(c.state==='eat'){c.t+=dt;c.g.position.y=0;c.lA.rotation.x=c.lB.rotation.x=-1.3;
  if(c.t>4){const b=c.tb,az=L.ex.z-1.6;b.occ=false;b.dirty=true;b.plates.visible=true;b.cash+=TIP;refreshTable(b);c.lA.rotation.x=c.lB.rotation.x=0;c.state='leave';
   c.path=[{x:b.x+2.6,z:b.z},{x:b.x+2.6,z:az},{x:L.ex.x,z:az},{x:L.ex.x,z:L.ex.z+4}];hud();}return;}
 let tx,tz;if(c.state==='queue'){tx=CT.x;tz=CT.z+1.9+CT.q.indexOf(c);}else{tx=c.path[0].x;tz=c.path[0].z;}
 const dx=tx-c.g.position.x,dz=tz-c.g.position.z,d=Math.hypot(dx,dz);let mv=false;
 if(d>.06){const s=Math.min(d,3*dt);c.g.position.x+=dx/d*s;c.g.position.z+=dz/d*s;c.bd.rotation.y=Math.atan2(dx,dz);mv=true;c.arr=false;}
 else if(c.state==='queue'){c.arr=true;c.bd.rotation.y=Math.PI;}
 else{c.path.shift();if(!c.path.length){if(c.state==='toTable'){c.state='eat';c.t=0;c.tb.res=false;c.tb.occ=true;c.bd.rotation.y=-Math.PI/2;}else{scene.remove(c.g);c.dead=true;}}}
 c.ph+=mv?dt*10:0;const s=mv?Math.sin(c.ph)*.7:0;c.lA.rotation.x=s;c.lB.rotation.x=-s;c.g.position.y=mv?Math.abs(Math.sin(c.ph))*.07:0;c.bub.position.y=2.3+Math.sin(performance.now()/300+c.ph)*.06;}
const srvAt=()=>dist(player.position.x,player.position.z,CT.x,CT.z+2.2)<3.2||workers.some(w=>w.role==='S'&&dist(w.g.position.x,w.g.position.z,CT.x,CT.z+2.2)<3.2);
function updCounter(dt){const f=CT.q[0];
 if(f&&f.state==='queue'&&f.arr&&CT.shelf>0&&srvAt()){const tb=tables.find(t=>!t.occ&&!t.dirty&&!t.res);
  if(tb){CT.sv+=dt;if(CT.sv>=CS[tier('counter')]){CT.sv=0;CT.shelf--;st(CT.sg,CT.shelf,'b');CT.q.shift();tb.res=true;f.tb=tb;f.state='toTable';f.bub.visible=false;f.path=[{x:tb.x+1.3,z:tb.z-1.7},{x:tb.x+1.3,z:tb.z}];
   let pay=PRICE;if(CT.dk>0){CT.dk--;pay+=DB;st(CT.dg,CT.dk,'d');}pile+=pay;refreshPile();popText(new THREE.Vector3(CT.x,2.8,CT.z+1),'+$'+pay,'#7CFC9A');beep(740,.08);}}else CT.sv=0;}
 else CT.sv=0;}
function careAll(dt){const act=[player.position].concat(workers.filter(w=>w.role==='S'||w.role==='H').map(w=>w.g.position));
 for(const t of tables){if(!act.some(a=>dist(a.x,a.z,t.x,t.z)<2.1)){t.ct=0;continue;}
  if(t.cash>0){const c=t.cash;earn(c);popText(new THREE.Vector3(t.x,2,t.z),'+$'+c,'#ffd23f');t.cash=0;refreshTable(t);beep(900,.08,.04);}
  if(t.dirty&&!t.occ){t.ct+=dt;if(t.ct>=.2){t.dirty=false;t.res=false;t.ct=0;t.plates.visible=false;beep(500,.06,.04);hud();}}}}

/* ================= workers AI ================= */
function wMove(w,tx,tz,dt){const q=w.g.position,dx=tx-q.x,dz=tz-q.z,d=Math.hypot(dx,dz),mv=d>.5;
 if(mv){const sp=3+.6*tier('hs');q.x+=dx/d*sp*dt;q.z+=dz/d*sp*dt;w.bd.rotation.y=Math.atan2(dx,dz);w.ph+=dt*10;const s=Math.sin(w.ph)*.7;w.lA.rotation.x=s;w.lB.rotation.x=-s;w.bd.position.y=Math.abs(Math.sin(w.ph))*.07;}
 else{w.ph+=dt*2.5;w.lA.rotation.x=w.lB.rotation.x=0;w.bd.position.y=Math.sin(w.ph)*.03;}
 return !mv;}
const nd=()=>dtq.length&&S.pack&&S.win&&(S.pack.inb+S.pack.out+S.win.stock.k)<dtq.length;
function updWorker(w,dt){const hc=w.carry,cap=HC[tier('hc')],P=w.g.position;let tx=w.home.x,tz=w.home.z,mode=null,s=null,serving=false;
 const D=S.drink,dn=hc.filter(x=>x==='d').length,useD=D&&D.stock>0&&CT.dk+dn<3,wait=CT.q[0]&&CT.q[0].state==='queue';
 const dirty=tables.filter(t=>t.dirty&&!t.occ).sort((a,b)=>dist(P.x,P.z,a.x,a.z)-dist(P.x,P.z,b.x,b.z))[0];
 if(w.role==='C'||w.role==='H'){
  if(w.role==='H'&&dirty&&!hc.length){mode='clean';tx=dirty.x+.6;tz=dirty.z+1.2;}
  else if(hc.length<cap&&(useD||G0.stock>0)){s=useD?D:G0;mode='pick';tx=s.px;tz=s.pz;}
  else if(hc.length){const t=hc[hc.length-1];if(t==='b'&&nd()&&S.pack.inb<8){mode='toPack';tx=S.pack.px;tz=S.pack.pz;}else if(t==='d'?CT.dk<6:CT.shelf<8){mode='toShelf';tx=CT.x;tz=CT.z+2.2;}}
  if(!mode&&w.role==='H'&&dirty){mode='clean';tx=dirty.x+.6;tz=dirty.z+1.2;}}
 else if(w.role==='S'){ // counter helper: keeps the shelf stocked, stays at the counter and hands food to the front customer
  if(dirty&&!hc.length&&!tables.some(t=>!t.occ&&!t.dirty&&!t.res)){mode='clean';tx=dirty.x+.6;tz=dirty.z+1.2;}
  else if(hc.length<cap&&G0.stock>0&&CT.shelf+hc.length<3){s=G0;mode='pick';tx=G0.px;tz=G0.pz;}
  else if(hc.length&&CT.shelf<8){mode='toShelf';tx=CT.x;tz=CT.z+2.2;}
  else if(dirty&&!(wait&&CT.shelf>0&&tables.some(t=>!t.occ&&!t.dirty&&!t.res))){mode='clean';tx=dirty.x+.6;tz=dirty.z+1.2;}
  serving=CT.sv>.001&&dist(P.x,P.z,CT.x,CT.z+2.2)<3.2;}
 else if(w.role==='D'){if(hc.length){mode='toWin';tx=S.win.px;tz=S.win.pz;}else if(S.pack&&S.pack.out>0&&dtq.length&&S.win.stock.k<dtq.length){mode='getBag';tx=S.pack.px;tz=S.pack.pz;}}
 const arr=wMove(w,tx,tz,dt);
 if(arr&&mode&&mode!=='clean'&&(w.t+=dt)>.15){w.t=0;
  if(mode==='pick'&&s.stock>0&&hc.length<cap){hc.push(s.fk);s.stock--;st(s.sg,s.stock,s.fk);}
  else if(mode==='toPack'&&hc.length&&S.pack.inb<8){hc.pop();S.pack.inb++;refreshPack();}
  else if(mode==='toShelf'&&hc.length){const t=hc.pop();if(t==='d'){CT.dk++;st(CT.dg,CT.dk,'d');}else{CT.shelf++;st(CT.sg,CT.shelf,'b');}}
  else if(mode==='getBag'&&S.pack.out>0&&hc.length<cap){hc.push('k');S.pack.out--;refreshPack();}
  else if(mode==='toWin'&&hc.length){hc.pop();S.win.stock.k++;st(S.win.sg,S.win.stock.k,'k');}}
 const key=(serving&&!hc.length)?'s':hc.join('');if(w.shown!==key){w.shown=key;stack(w.cg,key==='s'?['b']:hc);}
 w.aL.rotation.x=w.aR.rotation.x=(serving||hc.length)?-1.4:Math.sin(w.ph)*.15;}

/* ================= input ================= */
let jid=null,jx=0,jy=0;const jv={x:0,y:0},K={up:0,down:0,left:0,right:0},jb=$('jb'),jk=$('jk');
addEventListener('pointerdown',e=>{try{ac=ac||new AC();ac.resume();}catch(_){}
 if(jid!==null)return;jid=e.pointerId;jx=e.clientX;jy=e.clientY;jv.x=jv.y=0;jb.style.display='block';jb.style.left=jx+'px';jb.style.top=jy+'px';jk.style.transform='none';$('hint').style.opacity=0;});
addEventListener('pointermove',e=>{if(e.pointerId!==jid)return;let dx=e.clientX-jx,dy=e.clientY-jy;const R=55,l=Math.hypot(dx,dy);if(l>R){dx*=R/l;dy*=R/l;}jv.x=dx/R;jv.y=dy/R;jk.style.transform=`translate(${dx}px,${dy}px)`;});
const endJ=e=>{if(e.pointerId!==jid)return;jid=null;jv.x=jv.y=0;jb.style.display='none';};
addEventListener('pointerup',endJ);addEventListener('pointercancel',endJ);
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{if(KM[e.code]){K[KM[e.code]]=1;$('hint').style.opacity=0;e.preventDefault();}});
addEventListener('keyup',e=>{if(KM[e.code])K[KM[e.code]]=0;});

/* ================= main loop ================= */
const clock=new THREE.Clock();let tA=0,spawnT=1.5;
function update(dt){
 const p=player.position;
 if(cash!==lastC||pile!==lastP){lastC=cash;lastP=pile;dirty=true;}saveT+=dt;if(dirty&&saveT>.25){dirty=false;saveT=0;save();}
 let ix=jv.x+K.right-K.left,iy=jv.y+K.down-K.up;const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il;}if(il<.12)ix=iy=0;
 const wx=.7071*(ix+iy),wz=.7071*(iy-ix),SPD=PS(),k=1-Math.exp(-dt*14),ox=p.x,oz=p.z;
 vel.x+=(wx*SPD-vel.x)*k;vel.z+=(wz*SPD-vel.z)*k;
 if(!traveling){const nx=p.x+vel.x*dt;if(walk(nx,p.z))p.x=nx;else vel.x=0;const nz=p.z+vel.z*dt;if(walk(p.x,nz))p.z=nz;else vel.z=0;
  for(let it=0;it<2;it++)for(const s of solids){const dx=p.x-s.x,dz=p.z-s.z,ox2=s.hw+.45-Math.abs(dx),oz2=s.hd+.45-Math.abs(dz);if(ox2>0&&oz2>0){if(ox2<oz2)p.x+=Math.sign(dx||1)*ox2;else p.z+=Math.sign(dz||1)*oz2;}}
  if(!walk(p.x,p.z)){p.x=ox;p.z=oz;}}
 const spd=Math.hypot(vel.x,vel.z);
 if(spd>.4){const a=Math.atan2(vel.x,vel.z);let d=((a-body.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;body.rotation.y+=d*Math.min(1,dt*14);}
 walkP+=spd*dt*2.4;const sw=Math.min(1,spd/3)*.8;legL.rotation.x=Math.sin(walkP)*sw;legR.rotation.x=-Math.sin(walkP)*sw;
 const ar=carry.length?-1.5:0;armL.rotation.x=ar+(carry.length?0:-Math.sin(walkP)*sw);armR.rotation.x=ar+(carry.length?0:Math.sin(walkP)*sw);
 body.position.y=Math.abs(Math.sin(walkP))*.08*Math.min(1,spd/3);carryG.rotation.z=Math.sin(walkP*.5)*.03*Math.min(1,spd/3);
 // production: grill and (once built) cold drink bar
 if(G0.stock<8){G0.t+=dt;if(G0.t>=GI[tier('grill')]){G0.t=0;G0.stock++;st(G0.sg,G0.stock,'b');}}else G0.t=0;
 if(S.drink){const D=S.drink;if(D.stock<6){D.t+=dt;if(D.t>=DI[tier('drink')]){D.t=0;D.stock++;st(D.sg,D.stock,'d');}}else D.t=0;}
 // station interactions (every .11s, one action per tick)
 tA+=dt;if(tA>.11){tA=0;let ch=false;const cap=CAP(),D=S.drink;
  if(carry.length<cap&&G0.stock>0&&dist(p.x,p.z,G0.px,G0.pz)<1.7){carry.push('b');G0.stock--;st(G0.sg,G0.stock,'b');ch=true;beep(520+carry.length*40,.05,.03);$('hint').style.opacity=0;}
  else if(D&&carry.length<cap&&D.stock>0&&dist(p.x,p.z,D.px,D.pz)<1.7){carry.push('d');D.stock--;st(D.sg,D.stock,'d');ch=true;beep(660,.05,.03);}
  else if(carry.includes('b')&&CT.shelf<8&&dist(p.x,p.z,CT.x,CT.z+2.2)<2.8){take(carry,'b');CT.shelf++;st(CT.sg,CT.shelf,'b');ch=true;beep(400,.05,.03);}
  else if(carry.includes('d')&&CT.dk<6&&dist(p.x,p.z,CT.x,CT.z+2.2)<2.8){take(carry,'d');CT.dk++;st(CT.dg,CT.dk,'d');ch=true;beep(430,.05,.03);}
  else if(S.pack&&carry.includes('b')&&S.pack.inb<8&&dist(p.x,p.z,S.pack.px,S.pack.pz)<2.4){take(carry,'b');S.pack.inb++;refreshPack();ch=true;beep(420,.05,.03);}
  else if(S.pack&&carry.length<cap&&S.pack.out>0&&dist(p.x,p.z,S.pack.px,S.pack.pz)<2){carry.push('k');S.pack.out--;refreshPack();ch=true;beep(600,.05,.03);}
  else if(S.win&&carry.includes('k')&&dist(p.x,p.z,S.win.px,S.win.pz)<2.6){take(carry,'k');S.win.stock.k++;st(S.win.sg,S.win.stock.k,'k');ch=true;beep(450,.05,.03);}
  else if(carry.length&&dist(p.x,p.z,trash.x,trash.z)<1.7){carry.pop();ch=true;trash.lid.position.y=1.3;beep(180,.06,.04);}
  if(ch)syncCarry();}
 trash.lid.position.y+=(1.06-trash.lid.position.y)*Math.min(1,dt*10);
 // packing only happens while someone stands at the station
 if(S.pack){const pk=S.pack,here=dist(p.x,p.z,pk.px,pk.pz)<2.4||workers.some(w=>w.role==='P'&&dist(w.g.position.x,w.g.position.z,pk.px,pk.pz)<2.4),iv=PI[tier('pack')];
  if(here&&pk.inb>0&&pk.out<8){pk.prog+=dt;if(pk.prog>=iv){pk.prog=0;pk.inb--;pk.out++;refreshPack();beep(700,.05,.03);}}else if(!here)pk.prog=Math.max(0,pk.prog-dt);
  pk.bar.scale.x=Math.max(.001,pk.prog/iv);}
 if(pile>=1&&dist(p.x,p.z,cashPad.x,cashPad.z)<1.3){const c=Math.floor(pile);pile-=c;earn(c);popText(new THREE.Vector3(cashPad.x,2,cashPad.z),'+$'+c,'#ffd23f');refreshPile();beep(880,.1,.05);beep(1180,.12,.04);}
 careAll(dt);
 let near=null,nd=.85;pads.forEach(q=>{const d=dist(p.x,p.z,q.x,q.z);if(d<nd&&q.paid<q.cost){nd=d;near=q;}});
 for(let i=pads.length-1;i>=0;i--){const q=pads[i];
  if(q===near&&cash>=.01){const a=Math.min(cash,q.cost/1.2*dt,q.cost-q.paid);cash-=a;q.paid+=a;hud();}
  const f=Math.max(.001,q.paid/q.cost);q.f.scale.set(f,1,f);drawPad(q);
  if(q.paid>=q.cost-.001){pads.splice(i,1);scene.remove(q.g);T[q.k]=tier(q.k)+1;ensure(true);refreshPads();banner('LEVEL UP!','Lv '+lvOf()+': '+q.name);popText(new THREE.Vector3(q.x,2,q.z),q.name+'!','#ffffff');checkMax();save();hud();}}
 // doors: walk through to travel between hotels
 for(const kd of ['next','prev']){const o=doors[kd];if(!o)continue;const d=o.d,e=d.a==='E';
  if((e?p.x>d.x+.4:p.x<d.x-.4)&&Math.abs(p.z-d.z)<1){if(kd==='next'&&o.open&&BI<4)travel(BI+1,'prev');else if(kd==='prev')travel(BI-1,'next');}}
 spawnT+=dt;if(spawnT>=Math.max(1.8,4-lvOf()*.07)){spawnT=0;spawnCust();}
 updCounter(dt);for(let i=custs.length-1;i>=0;i--){updCust(custs[i],dt);if(custs[i].dead)custs.splice(i,1);}
 carsUpd(dt);workers.forEach(w=>updWorker(w,dt));
 for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.t+=dt;if(q.t<=0)continue;const kk=Math.min(q.t/.4,1),c3=2.70158,e=1+c3*Math.pow(kk-1,3)+1.70158*Math.pow(kk-1,2);q.o.scale.setScalar(Math.max(.001,e));if(kk>=1){q.o.scale.setScalar(1);pops.splice(i,1);}}
 const ck=1-Math.exp(-dt*4);camT.x+=(CX+(p.x-CX)*follow-camT.x)*ck;camT.z+=(CZ+(p.z-CZ)*follow-camT.z)*ck;cam.position.copy(camT).add(camOff);cam.lookAt(camT);}
function loop(){requestAnimationFrame(loop);update(Math.min(clock.getDelta(),.05));renderer.render(scene,cam);}

/* ================= boot ================= */
addTable(L.tabs[0],false);ensure(false);refreshPads();refreshPile();refreshDoors();checkMax();syncCarry();hud();
camT.set(player.position.x,0,player.position.z);cam.position.copy(camT).add(camOff);cam.lookAt(camT);cam.updateMatrixWorld();
if(tier('grill')+tier('counter')>0)$('hint').style.opacity=0;
setTimeout(()=>{$('hint').style.opacity=0;},12000);
setTimeout(()=>{$('fade').style.opacity=0;},80);
loop();
})();
